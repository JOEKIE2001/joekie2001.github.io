<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 2560, H = +P.get('h') || 1600, SEED = +P.get('seed') || 11.3, OX = +P.get('ox') || 0;
const c = document.getElementById('c'); c.width = W; c.height = H;
const gl = c.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
const fs = `
precision highp float;
uniform vec2 res; uniform float seed; uniform float ox;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p, int oct){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<6;i++){ if(i>=oct) break; v+=a*n(p); p=m*p; a*=.5; } return v; }
vec2 warp(vec2 uv){
  vec2 q = vec2(fbm(uv + seed, 4), fbm(uv + vec2(5.2,1.3) - seed, 4));
  vec2 r = vec2(fbm(uv + 2.6*q + vec2(1.7,9.2), 4), fbm(uv + 2.6*q + vec2(8.3,2.8), 4));
  return r;
}
float height(vec2 uv){ vec2 r = warp(uv); return fbm(uv + 2.4*r, 4); }
void main(){
  vec2 uv = gl_FragCoord.xy / res.y * 1.05 + vec2(ox, 0.);
  float e = 0.6 / res.y;
  float f  = height(uv);
  float fx = height(uv + vec2(e,0.));
  float fy = height(uv + vec2(0.,e));
  vec3 N = normalize(vec3(-(fx-f)/e*0.05, -(fy-f)/e*0.05, 1.0));
  vec3 V = vec3(0.,0.,1.);
  vec3 R = reflect(-V, N);
  // studio environment: soft gradient sky plus two long light strips
  float sky = smoothstep(-0.9, 0.9, R.y*0.9 + R.x*0.25);
  vec3 env = mix(vec3(0.16,0.17,0.20), vec3(0.86,0.88,0.92), sky);
  float strip1 = smoothstep(0.10, 0.0, abs(R.y*0.8 - R.x*0.6 - 0.35));
  float strip2 = smoothstep(0.06, 0.0, abs(R.y*0.5 + R.x*0.85 + 0.25));
  env += vec3(1.0)*strip1*0.9 + vec3(1.0,0.99,0.97)*strip2*0.6;
  float fres = pow(1.0 - clamp(N.z,0.,1.), 2.0);
  vec3 L = normalize(vec3(-0.4, 0.65, 0.65));
  float dif = clamp(dot(N,L),0.,1.);
  float spec = pow(clamp(dot(reflect(-L,N),V),0.,1.), 120.);
  // material mask: beige-dominant with silver ribbons following the flow
  vec2 r = warp(uv*0.8 + 3.1);
  float m = smoothstep(0.47, 0.53, fbm(uv*0.7 + 1.8*r + seed*0.37, 4));
  vec3 chrome = mix(env, vec3(0.72,0.74,0.78), 0.18) + spec*1.2 + fres*0.25;
  vec3 pearl  = vec3(0.95,0.92,0.86)*(0.88 + 0.14*dif) + vec3(1.0,0.98,0.95)*pow(clamp(dot(reflect(-L,N),V),0.,1.),18.)*0.25 + spec*0.4;
  // thin bright seam where the two materials meet
  float seam = smoothstep(0.03, 0.0, abs(fbm(uv*0.7 + 1.8*r + seed*0.37, 4) - 0.5));
  vec3 col = mix(chrome, pearl, m) + seam*vec3(1.0)*0.18;
  gl_FragColor = vec4(clamp(col,0.,1.), 1.0);
}`;
function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x); if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.viewport(0,0,W,H);
gl.uniform2f(gl.getUniformLocation(pr,'res'),W,H); gl.uniform1f(gl.getUniformLocation(pr,'seed'),SEED); gl.uniform1f(gl.getUniformLocation(pr,'ox'),OX);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4); gl.finish();
window.DONE = true;
</script></body></html>
