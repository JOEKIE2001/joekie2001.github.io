# My music, in two sections. Put audio files (.mp3 or .m4a) in files/music/
# and square cover images (.jpg / .png) in images/music/, then add a block:
#
# - title: "Song name"              (first line, larger)
#   subtitle: "Original by Artist"  (second line, smaller)
#   file: my-song.m4a
#   cover: my-song.jpg
#   fav: true                       (optional: silver star after the title)
#
# Songs are shown in the order listed here (top = first).

covers:
  - title: "kiss me"
