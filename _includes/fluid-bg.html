<!-- Moving purple-and-beige "paint" background (WebGL). Turn off on a page with  fluid_bg: false  in its front matter. -->
<canvas id="fluid-bg" aria-hidden="true"></canvas>
<script>
(function () {
  var canvas = document.getElementById('fluid-bg');
  var gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  if (!gl) return; /* no WebGL: the CSS gradient fallback stays */

  var vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  var fs = [
    'precision mediump float;',
    'uniform vec2 res; uniform float t;',
    'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }',
    'float fbm(vec2 p){ float v=0.0, a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);',
    '  for(int i=0;i<5;i++){ v+=a*n(p); p=m*p; a*=0.5; } return v; }',
    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / res.y * 1.6;',
    '  float s = t * 0.035;',
    '  vec2 q = vec2(fbm(uv + s), fbm(uv + vec2(5.2, 1.3) - s));',
    '  vec2 r = vec2(fbm(uv + 3.5*q + vec2(1.7, 9.2) + 0.6*s), fbm(uv + 3.5*q + vec2(8.3, 2.8) - 0.5*s));',
    '  float f = fbm(uv + 3.5*r);',
    '  vec3 deep   = vec3(0.22, 0.03, 0.34);',
    '  vec3 nyu    = vec3(0.34, 0.024, 0.55);',
    '  vec3 lilac  = vec3(0.64, 0.50, 0.76);',
    '  vec3 beige  = vec3(0.93, 0.89, 0.82);',
    '  vec3 cream  = vec3(0.96, 0.94, 0.89);',
    '  float k = smoothstep(0.22, 0.62, f);',
    '  vec3 c = mix(deep, nyu, smoothstep(0.0, 0.18, k));',
    '  c = mix(c, lilac, smoothstep(0.16, 0.36, k));',
    '  c = mix(c, beige, smoothstep(0.30, 0.55, k));',
    '  c = mix(c, cream, smoothstep(0.75, 1.0, k) * 0.6);',
    '  c = mix(c * 0.9, c, smoothstep(0.0, 1.0, length(r)));',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uRes = gl.getUniformLocation(prog, 'res');
  var uT = gl.getUniformLocation(prog, 't');

  /* Draw at a third of screen resolution: soft, paint-like, and light on phones */
  var SCALE = 3;
  function resize() {
    canvas.width = Math.max(1, Math.round(window.innerWidth / SCALE));
    canvas.height = Math.max(1, Math.round(window.innerHeight / SCALE));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var start = performance.now();
  var offset = Math.random() * 100;
  function frame(now) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uT, offset + (now - start) / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!still && !document.hidden) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !still) requestAnimationFrame(frame); });
  requestAnimationFrame(frame);
})();
</script>
